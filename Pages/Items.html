            <script>
        fetch('\assets\txtfiles\BBan 1 hoodie stock.txt')  // bban 1 hoodie stocks
            .then(response => response.text())
            .then(text => {
                document.getElementById('BBan1hoodiestock').textContent = text;
            })
            .catch(error => console.error('Error fetching text file:', error));
